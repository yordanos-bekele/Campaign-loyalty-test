spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/campaign_loyalty
    username: marathon
    password: kingdom         # override via application-local.yaml or env vars
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # safe default: never auto-drop/create in prod
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true        # pretty-print SQL logs


# ── Server ────────────────────────────────────────────────────
server:
  port: 8080

campaign:
  admin:
    username: ${CAMPAIGN_ADMIN_USERNAME:admin}
    password: ${CAMPAIGN_ADMIN_PASSWORD:admin123}
  cors:
    allowed-origin-patterns: ${CAMPAIGN_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,https://*.ngrok-free.app,https://*.ngrok.app,https://*.vercel.app,https://*.onrender.com}

