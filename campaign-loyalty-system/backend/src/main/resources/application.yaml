spring:
  # ── Active profiles ─────────────────────────────────────────
  # Override locally: export SPRING_PROFILES_ACTIVE=local
  profiles:
    active: dev

  # ── Data source ─────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/campaign_loyalty
    username: marathon
    password: kingdom         # override via application-local.yaml or env vars
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate        # safe default: never auto-drop/create in prod
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true        # pretty-print SQL logs


# ── Server ────────────────────────────────────────────────────
server:
  port: 8080
