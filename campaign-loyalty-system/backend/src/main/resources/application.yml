spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campaign_loyalty}
    username: ${SPRING_DATASOURCE_USERNAME:yordanos}
    password: ${SPRING_DATASOURCE_PASSWORD:kingdom}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        same-site: ${SERVER_SESSION_COOKIE_SAME_SITE:Lax}
        secure: ${SERVER_SESSION_COOKIE_SECURE:false}

campaign:
  admin:
    username: ${CAMPAIGN_ADMIN_USERNAME:admin}
    password: ${CAMPAIGN_ADMIN_PASSWORD:admin123}
  cors:
    allowed-origin-patterns: ${CAMPAIGN_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,https://*.ngrok-free.app,https://*.ngrok.app,https://*.vercel.app,https://*.onrender.com}
