spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    session:
      cookie:
        same-site: ${SERVER_SESSION_COOKIE_SAME_SITE:None}
        secure: ${SERVER_SESSION_COOKIE_SECURE:true}

campaign:
  admin:
    username: ${CAMPAIGN_ADMIN_USERNAME}
    password: ${CAMPAIGN_ADMIN_PASSWORD}
  cors:
    allowed-origin-patterns: ${CAMPAIGN_CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,https://*.ngrok-free.app,https://*.ngrok.app,http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  time-gap-minutes: ${CAMPAIGN_TIME_GAP_MINUTES:60}
  daily-scan-limit: ${CAMPAIGN_DAILY_SCAN_LIMIT:3}
  reward-threshold: ${CAMPAIGN_REWARD_THRESHOLD:10}
